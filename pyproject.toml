[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyappify"
version = "1.0.19"
description = "My awesome Python application"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
pyappify = "pyappify.main:main"

[project.optional-dependencies]
dev = ["twine", "build"]
# Updating a git clone of the app without the PyAppify launcher.
standalone = ["dulwich>=1.2; python_version >= '3.10'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyappify"]
